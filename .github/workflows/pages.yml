# workflow-version: v2
# 此檔案由 publisher.py 自動管理，請勿手動修改。
# 根本原因修復：加入 concurrency group 防止 pages-build-deployment 競爭導致
#   "Error: Deployment failed, try again later" 錯誤。
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ★ 關鍵：防止競爭部署（deployment_queued 卡死 / syncing_files 超時）
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
